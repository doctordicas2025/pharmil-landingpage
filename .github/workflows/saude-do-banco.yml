# Alarme de queda do banco da Pharmil (25/11/2026).
#
# A cada 5 minutos, de fora do Supabase, pergunta ao painel se o banco responde. Quem confere o banco e avisa a
# equipe é o painel; aqui o job falha quando a resposta não é 200, e o GitHub manda o e-mail de falha à conta.
# Não usa segredo nem o código deste repositório.
#
# Limites: o GitHub pode atrasar a execução agendada alguns minutos e desliga o agendamento de um repositório
# que fica 60 dias sem commit (reativar na aba Actions).
name: Saúde do banco

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  conferir:
    name: Painel confirma o banco de pé
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/saude
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 40 https://dashboard.pharmilmed.com/api/saude || true)
          echo "resposta: ${codigo}"
          if [ "${codigo}" != "200" ]; then
            echo "::error::O painel não confirmou o banco de pé (HTTP ${codigo})."
            exit 1
          fi
